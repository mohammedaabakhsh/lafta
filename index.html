<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="لفتة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>لفتة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F4F1;
    --surface: #FFFFFF;
    --ink: #1E2629;
    --muted: #6E7B7F;
    --line: #DDE1DC;
    --brass: #A9823A;
    --on-ink: #F3F4F1;
    --danger: #A8402F;
    --note-bg: #F7F1E4;
    --note-ink: #6B5223;
    --backdrop: rgba(20, 24, 26, .38);

    --t-link: #2E6A88;  --t-place: #3C7A57;  --t-info: #A9823A;  --t-data: #765B8C;
    --t-idea: #B4553A;  --t-book: #4B5E9C;   --t-person: #2F7F86; --t-product: #8A6A4F;

    --r-sm: 8px;
    --r-md: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181A;
      --surface: #1C2225;
      --ink: #E6EAE8;
      --muted: #8E9B9F;
      --line: #2B3337;
      --brass: #C9A45C;
      --on-ink: #14181A;
      --danger: #E07A66;
      --note-bg: #2A2519;
      --note-ink: #D9BE86;
      --backdrop: rgba(0, 0, 0, .6);

      --t-link: #6FA9C9;  --t-place: #74B48F;  --t-info: #D2AE68;  --t-data: #AE93C4;
      --t-idea: #E08C70;  --t-book: #8B9BD6;   --t-person: #6BBCC2; --t-product: #C2A285;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 400 16px/1.6 "IBM Plex Sans Arabic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  input[type=text], input[type=password], input[type=url], input[type=search], textarea {
    width: 100%; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-sm); outline: none;
    transition: border-color .15s;
  }
  input:focus, textarea:focus { border-color: var(--ink); }
  input[dir=ltr] { text-align: left; }
  textarea { resize: vertical; min-height: 84px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: var(--r-sm); border: 1px solid var(--ink);
    background: var(--ink); color: var(--on-ink); font-weight: 500; cursor: pointer;
  }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn-wide { width: 100%; }
  .btn-quiet { background: transparent; color: var(--ink); border-color: var(--line); }

  /* ---------- Lock ---------- */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
  .lock-inner { width: 100%; max-width: 380px; }
  .keyhole { display: block; width: 56px; height: 56px; margin: 0 0 28px; color: var(--brass); }
  .lock-title { font-size: 64px; line-height: 1; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.5px; }
  .lock-sub { color: var(--muted); margin: 0 0 32px; }
  label.field { display: block; margin-bottom: 16px; }
  .field-name { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field-hint { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .key-wrap { position: relative; display: block; }
  .key-wrap input { padding-left: 76px; }
  .key-toggle {
    position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--muted); font-size: 13px; padding: 6px 10px; cursor: pointer; border-radius: var(--r-sm);
  }
  .error { color: var(--danger); font-size: 14px; margin: 12px 0 0; min-height: 1.6em; }

  /* ---------- App ---------- */
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 120px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .app-title { font-size: 30px; font-weight: 700; margin: 0; line-height: 1.2; }
  .count { color: var(--muted); font-size: 14px; font-weight: 400; margin-inline-start: 8px; }
  .lock-btn { padding: 7px 14px; font-size: 14px; }
  .preview-note { margin: -4px 0 16px; padding: 10px 14px; border-radius: var(--r-sm); font-size: 14px; background: var(--note-bg); color: var(--note-ink); }

  .search { position: relative; margin-bottom: 12px; }
  .search input { padding-inline-start: 40px; background: var(--surface); }
  .search svg { position: absolute; inset-inline-start: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search-clear {
    position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--muted); font-size: 13px; padding: 6px 10px; cursor: pointer;
  }

  .filters {
    display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 16px; padding: 2px 16px 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 999px;
    padding: 5px 14px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .chip .n { color: var(--muted); margin-inline-start: 4px; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .chip[aria-pressed=true] .n { color: inherit; opacity: .7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 14px 14px 14px; cursor: pointer; text-align: start; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--tc); }
  .card:active { transform: scale(.985); }
  .card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .card-type { color: var(--tc); font-weight: 500; }
  .card h3 {
    margin: 2px 0 0; font-size: 16px; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-link {
    display: block; color: var(--t-link); font-size: 13px; text-decoration: none; direction: ltr; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0;
  }
  .card-link:hover { text-decoration: underline; }
  .card-note {
    margin: 2px 0 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card.fresh { animation: in .35s ease-out; }

  [data-type=link] { --tc: var(--t-link); }   [data-type=place] { --tc: var(--t-place); }
  [data-type=info] { --tc: var(--t-info); }   [data-type=data] { --tc: var(--t-data); }
  [data-type=idea] { --tc: var(--t-idea); }   [data-type=book] { --tc: var(--t-book); }
  [data-type=person] { --tc: var(--t-person); } [data-type=product] { --tc: var(--t-product); }

  .empty { color: var(--muted); padding: 48px 12px; text-align: center; }

  .add {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 5;
    padding: 14px 30px; border-radius: 999px; font-size: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .add svg { width: 18px; height: 18px; }

  /* ---------- Sheet ---------- */
  dialog.sheet {
    padding: 0; border: 0; margin: auto auto 0; width: 100%; max-width: 620px; max-height: 92vh;
    background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0;
  }
  dialog.sheet::backdrop { background: var(--backdrop); }
  dialog.sheet[open] { animation: up .22s ease-out; }
  @media (min-width: 700px) { dialog.sheet { margin: auto; border-radius: 18px; } }
  .sheet-form { padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); }
  .grabber { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .x-btn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 8px; cursor: pointer; border-radius: var(--r-sm); }
  .types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .types input { position: absolute; opacity: 0; pointer-events: none; }
  .types label {
    display: block; text-align: center; padding: 8px 2px; border-radius: var(--r-sm);
    border: 1px solid var(--line); font-size: 14px; cursor: pointer; user-select: none; background: var(--surface);
  }
  .types label:has(input:checked) { border-color: var(--tc); color: var(--tc); font-weight: 700; background: color-mix(in srgb, var(--tc) 10%, var(--surface)); }
  .types label:has(input:focus-visible) { outline: 2px solid var(--brass); outline-offset: 2px; }
  .row { margin-bottom: 10px; }
  .sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .sheet-actions .btn { flex: 0 0 auto; }
  .del {
    margin-inline-start: auto; background: none; border: 0; color: var(--muted);
    font-size: 14px; padding: 10px 8px; cursor: pointer; border-radius: var(--r-sm);
  }
  .del.armed { color: var(--danger); font-weight: 500; }

  .toast {
    position: fixed; inset-inline: 0; bottom: calc(92px + env(safe-area-inset-bottom)); margin: 0 auto; width: max-content; max-width: calc(100% - 36px);
    background: var(--ink); color: var(--on-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20;
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.bad { background: var(--danger); color: #fff; }

  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

  @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="loading" class="loading">يفتح…</div>

<!-- ============ Lock ============ -->
<main id="lock" hidden>
  <form class="lock-inner" id="lockForm" autocomplete="off">
    <svg class="keyhole" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="27" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="28" cy="23" r="7" fill="currentColor"/>
      <path d="M24.5 26 L22 40 H34 L31.5 26 Z" fill="currentColor"/>
    </svg>
    <h1 class="lock-title">لفتة</h1>
    <p class="lock-sub">افتح بمفتاح GitHub حقك.</p>

    <label class="field">
      <span class="field-name">اسم المستخدم في GitHub</span>
      <input type="text" id="owner" dir="ltr" required spellcheck="false" autocapitalize="off">
    </label>
    <label class="field">
      <span class="field-name">ريبو الداتا (الخاص)</span>
      <input type="text" id="repo" dir="ltr" required spellcheck="false" autocapitalize="off" value="lafta-data">
    </label>
    <label class="field">
      <span class="field-name">المفتاح</span>
      <span class="key-wrap">
        <input type="password" id="token" name="lafta-key" dir="ltr" required spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="github_pat_…">
        <button type="button" class="key-toggle" id="keyToggle" aria-pressed="false">إظهار</button>
      </span>
      <span class="field-hint">ينحفظ في هذا الجهاز بس.</span>
    </label>

    <button class="btn btn-wide" type="submit" id="unlockBtn">افتح</button>
    <p class="error" id="lockError" role="alert"></p>
  </form>
</main>

<!-- ============ App ============ -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <h1 class="app-title">لفتة<span class="count" id="count"></span></h1>
      <button class="btn btn-quiet lock-btn" id="lockBtn" type="button">قفل</button>
    </header>
    <p class="preview-note" id="previewNote" hidden>معاينة: اللي تضيفه هنا ينحفظ في هذا الجهاز بس. النسخة الحقيقية تحفظ في GitHub.</p>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="ابحث في أشيائك" aria-label="بحث" autocomplete="off" enterkeyhint="search">
      <button type="button" class="search-clear" id="qClear" hidden>مسح</button>
    </div>

    <div class="filters" id="filters" role="group" aria-label="فلترة حسب النوع"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </div>

  <button class="btn add" id="addBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    أضف
  </button>
</div>

<!-- ============ Add / edit sheet ============ -->
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <form class="sheet-form" id="sheetForm" novalidate autocomplete="off">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">إضافة</h2>
      <button type="button" class="x-btn" id="sheetClose">إغلاق</button>
    </div>
    <div class="types" id="typeGrid" role="radiogroup" aria-label="النوع"></div>
    <div class="row"><input type="text" id="fTitle" placeholder="العنوان" aria-label="العنوان"></div>
    <div class="row"><input type="url" id="fUrl" dir="ltr" placeholder="https://" aria-label="اللينك (اختياري)" inputmode="url" autocapitalize="off" spellcheck="false"></div>
    <div class="row"><textarea id="fNote" placeholder="ملاحظة (اختياري)" aria-label="ملاحظة"></textarea></div>
    <div class="sheet-actions">
      <button class="btn" type="submit" id="saveBtn">احفظ</button>
      <button class="btn btn-quiet" type="button" id="cancelBtn">إلغاء</button>
      <button class="del" type="button" id="delBtn" hidden>حذف</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const PREVIEW = false;   // true = try the app without GitHub (data stays on this device)
  const API = 'https://api.github.com';
  const FILE = 'data.json';
  const STORE = 'lafta.v1';
  const DEMO = 'lafta.demo';

  // key, singular, plural
  const TYPES = [
    ['link', 'لينك', 'لينكات'], ['place', 'مكان', 'أماكن'], ['info', 'معلومة', 'معلومات'], ['data', 'داتا', 'داتا'],
    ['idea', 'فكرة', 'أفكار'], ['book', 'كتاب', 'كتب'], ['person', 'شخص', 'أشخاص'], ['product', 'منتج', 'منتجات'],
  ];
  const TYPE = Object.fromEntries(TYPES.map(([k, s, p]) => [k, { s, p }]));
  const typeOf = (it) => (TYPE[it.type] ? it.type : 'info');

  const $ = (id) => document.getElementById(id);
  const state = { cfg: null, items: [], sha: null, filter: 'all', query: '', busy: false, editing: null, fresh: null };

  /* ---------- local config (per device) ---------- */
  const loadCfg = () => { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } };
  const saveCfg = (c) => { try { localStorage.setItem(STORE, JSON.stringify(c)); } catch {} };

  /* ---------- preview storage (no GitHub) ---------- */
  let memDemo = null;
  function seed() {
    const t = (d) => new Date(Date.now() - d * 86400000).toISOString();
    return [
      { id: 's1', type: 'place', title: 'الكورنيش الشمالي', url: 'https://maps.google.com/?q=Jeddah+North+Corniche', note: 'المشي وقت المغرب', createdAt: t(5) },
      { id: 's2', type: 'link', title: 'Smashing Magazine', url: 'https://www.smashingmagazine.com', note: 'مقالات عن تصميم الواجهات', createdAt: t(4) },
      { id: 's3', type: 'info', title: 'مفتاح GitHub ينحفظ في الجهاز بس', url: '', note: 'عشان كده ما ينحط في الكود', createdAt: t(3) },
      { id: 's4', type: 'idea', title: 'زر حفظ من قائمة المشاركة', url: '', note: 'أحفظ أي لينك من أي تطبيق بضغطة', createdAt: t(2) },
      { id: 's5', type: 'book', title: 'The Design of Everyday Things', url: '', note: 'Don Norman', createdAt: t(1) },
      { id: 's6', type: 'data', title: 'مقاس الغرفة', url: '', note: '4 × 5 م', createdAt: t(0) },
    ];
  }
  function demoLoad() {
    try { const s = localStorage.getItem(DEMO); if (s) return JSON.parse(s); } catch {}
    return memDemo || (memDemo = seed());
  }
  function demoSave(items) { memDemo = items; try { localStorage.setItem(DEMO, JSON.stringify(items)); } catch {} }

  /* ---------- UTF-8 safe base64 (Arabic text) ---------- */
  function encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function decode(b64) {
    const bin = atob(b64.replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  }

  /* ---------- GitHub API ---------- */
  class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }

  async function gh(path, opts = {}) {
    try {
      return await fetch(API + path, {
        ...opts,
        cache: 'no-store',
        headers: {
          Authorization: 'Bearer ' + state.cfg.token,
          Accept: 'application/vnd.github+json',
          ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
        },
      });
    } catch {
      throw new GhError(0, 'ما قدرت أتصل بـ GitHub. تأكد من النت.');
    }
  }

  function errorFor(status, ctx) {
    if (status === 401) return 'المفتاح غلط أو منتهي.';
    if (status === 403) return ctx === 'write'
      ? 'المفتاح ما عنده صلاحية كتابة. خلي Contents على Read and write.'
      : 'GitHub رفض الطلب. تأكد من صلاحيات المفتاح.';
    if (status === 404) return ctx === 'repo'
      ? `المفتاح شغال، بس ما يشوف "${state.cfg.repo}". تأكد إنك لصقت المفتاح الجديد، وإنه مربوط بهذا الريبو.`
      : 'ما لقيت الملف. تأكد إن المفتاح له صلاحية Contents.';
    return 'صار خطأ من GitHub (' + status + '). جرب مرة ثانية.';
  }

  const repoPath = () => `/repos/${encodeURIComponent(state.cfg.owner)}/${encodeURIComponent(state.cfg.repo)}`;

  async function checkRepo() {
    const res = await gh(repoPath());
    if (!res.ok) throw new GhError(res.status, errorFor(res.status, 'repo'));
    const j = await res.json();
    if (!j.private) throw new GhError(-1, 'هذا الريبو عام، يعني أي أحد يقدر يشوف أشياءك. خله Private وارجع.');
  }

  async function readData() {
    if (state.cfg.demo) return { items: demoLoad(), sha: 'demo' };
    const res = await gh(`${repoPath()}/contents/${FILE}`);
    if (res.status === 404) return { items: [], sha: null };           // no file yet: first save creates it
    if (!res.ok) throw new GhError(res.status, errorFor(res.status, 'read'));
    const j = await res.json();
    let parsed;
    try { parsed = JSON.parse(decode(j.content || '')); } catch { parsed = { items: [] }; }
    return { items: Array.isArray(parsed.items) ? parsed.items : [], sha: j.sha };
  }

  async function writeData(items, sha, message) {
    if (state.cfg.demo) { demoSave(items); return { sha: 'demo' }; }
    const body = { message, content: encode(JSON.stringify({ version: 1, items }, null, 2) + '\n') };
    if (sha) body.sha = sha;
    const res = await gh(`${repoPath()}/contents/${FILE}`, { method: 'PUT', body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) return { conflict: true };
    if (!res.ok) throw new GhError(res.status, errorFor(res.status, 'write'));
    const j = await res.json();
    return { sha: j.content.sha };
  }

  // Apply a change on top of the latest data; if another device saved first, re-read and retry.
  async function mutate(change, message) {
    let items = state.items, sha = state.sha;
    for (let attempt = 0; attempt < 3; attempt++) {
      const next = change(items.slice());
      const r = await writeData(next, sha, message);
      if (!r.conflict) { state.items = next; state.sha = r.sha; return; }
      ({ items, sha } = await readData());
    }
    throw new GhError(409, 'الملف تغير من جهاز ثاني. حدّث الصفحة وجرب.');
  }

  /* ---------- helpers ---------- */
  let toastTimer;
  function toast(msg, bad = false) {
    const t = $('toast');
    t.textContent = msg; t.classList.toggle('bad', bad); t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), bad ? 4000 : 1800);
  }
  function show(screen) {
    $('loading').hidden = screen !== 'loading';
    $('lock').hidden = screen !== 'lock';
    $('app').hidden = screen !== 'app';
  }
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const fmtDate = new Intl.DateTimeFormat('ar-u-ca-gregory-nu-latn', { day: 'numeric', month: 'short' });
  const fmtDateYear = new Intl.DateTimeFormat('ar-u-ca-gregory-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' });
  function dateLabel(iso) {
    const d = new Date(iso);
    return d.getFullYear() === new Date().getFullYear() ? fmtDate.format(d) : fmtDateYear.format(d);
  }

  function normalizeUrl(raw) {
    const s = (raw || '').trim();
    if (!s) return '';
    const withScheme = /^[a-z][a-z0-9+.-]*:/i.test(s) ? s : 'https://' + s;
    try {
      const u = new URL(withScheme);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
    } catch { return null; }
  }
  const prettyUrl = (href) => { try { const u = new URL(href); return (u.host.replace(/^www\./, '') + u.pathname + u.search).replace(/\/$/, ''); } catch { return href; } };

  // Arabic-aware search: ignore diacritics, tatweel, and alef/ta-marbuta/ya variants
  const norm = (s) => (s || '').toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');

  /* ---------- build static UI from TYPES ---------- */
  $('typeGrid').append(...TYPES.map(([k, s]) => {
    const l = document.createElement('label');
    l.dataset.type = k;
    l.innerHTML = `<input type="radio" name="type" value="${k}"><span></span>`;
    l.querySelector('span').textContent = s;
    return l;
  }));

  /* ---------- render ---------- */
  function renderFilters() {
    const counts = {};
    for (const it of state.items) counts[typeOf(it)] = (counts[typeOf(it)] || 0) + 1;
    if (state.filter !== 'all' && !counts[state.filter]) state.filter = 'all';
    const chips = [['all', 'الكل', state.items.length], ...TYPES.filter(([k]) => counts[k]).map(([k, , p]) => [k, p, counts[k]])];
    const box = $('filters');
    box.replaceChildren(...chips.map(([k, label, n]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.f = k;
      b.setAttribute('aria-pressed', String(state.filter === k));
      b.textContent = label;
      const c = document.createElement('span'); c.className = 'n'; c.textContent = n;
      b.append(c);
      return b;
    }));
    box.hidden = state.items.length === 0;
  }

  function renderGrid() {
    const q = norm(state.query).trim().split(/\s+/).filter(Boolean);
    const all = [...state.items].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const shown = all.filter((it) => {
      if (state.filter !== 'all' && typeOf(it) !== state.filter) return false;
      if (!q.length) return true;
      const hay = norm([it.title, it.url, it.note, TYPE[typeOf(it)].s].join(' '));
      return q.every((w) => hay.includes(w));
    });

    $('grid').replaceChildren(...shown.map((it) => {
      const card = document.createElement('article');
      card.className = it.id === state.fresh ? 'card fresh' : 'card';
      card.dataset.type = typeOf(it);
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', 'تعديل: ' + (it.title || ''));

      const meta = document.createElement('div'); meta.className = 'card-meta';
      const tp = document.createElement('span'); tp.className = 'card-type'; tp.textContent = TYPE[typeOf(it)].s;
      meta.append(tp);
      if (it.createdAt) { const tm = document.createElement('time'); tm.dateTime = it.createdAt; tm.textContent = dateLabel(it.createdAt); meta.append(tm); }
      card.append(meta);

      if (it.title) { const h = document.createElement('h3'); h.textContent = it.title; card.append(h); }
      const href = it.url ? normalizeUrl(it.url) : '';
      if (href) {
        const a = document.createElement('a');
        a.className = 'card-link'; a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = prettyUrl(href);
        a.addEventListener('click', (e) => e.stopPropagation());
        card.append(a);
      }
      if (it.note) { const p = document.createElement('p'); p.className = 'card-note'; p.textContent = it.note; card.append(p); }

      card.addEventListener('click', () => openSheet(it));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(it); } });
      return card;
    }));

    const empty = $('empty');
    if (!all.length) { empty.textContent = 'ما فيه شي محفوظ. اضغط "أضف" وحط أول شي لفتك.'; empty.hidden = false; }
    else if (!shown.length && q.length) { empty.textContent = 'ما لقيت شي فيه "' + state.query.trim() + '".'; empty.hidden = false; }
    else if (!shown.length) { empty.textContent = 'ما فيه شي من هذا النوع.'; empty.hidden = false; }
    else empty.hidden = true;
  }

  function render() {
    $('count').textContent = state.items.length ? String(state.items.length) : '';
    renderFilters();
    renderGrid();
    state.fresh = null;
  }

  /* ---------- sheet (add / edit) ---------- */
  const sheet = $('sheet');
  let lastType = 'link';

  function resetDelete() { const d = $('delBtn'); d.classList.remove('armed'); d.textContent = 'حذف'; d.disabled = false; }

  function openSheet(item = null) {
    state.editing = item;
    $('sheetTitle').textContent = item ? 'تعديل' : 'إضافة';
    $('saveBtn').textContent = item ? 'احفظ التعديل' : 'احفظ';
    const type = item ? typeOf(item) : lastType;
    for (const r of document.querySelectorAll('input[name=type]')) r.checked = r.value === type;
    $('fTitle').value = item ? item.title || '' : '';
    $('fUrl').value = item ? item.url || '' : '';
    $('fNote').value = item ? item.note || '' : '';
    $('delBtn').hidden = !item;
    resetDelete();
    if (typeof sheet.showModal === 'function') sheet.showModal(); else sheet.setAttribute('open', '');
    if (!item) setTimeout(() => $('fTitle').focus(), 50);
  }
  function closeSheet() {
    if (sheet.open) { if (typeof sheet.close === 'function') sheet.close(); else sheet.removeAttribute('open'); }
    state.editing = null;
  }
  $('sheetClose').addEventListener('click', closeSheet);
  $('cancelBtn').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet && !state.busy) closeSheet(); });
  sheet.addEventListener('close', () => { state.editing = null; });
  $('addBtn').addEventListener('click', () => openSheet());

  $('sheetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (state.busy) return;
    const type = (document.querySelector('input[name=type]:checked') || {}).value || 'link';
    const title = $('fTitle').value.trim();
    const note = $('fNote').value.trim();
    const url = normalizeUrl($('fUrl').value);
    if (url === null) { toast('اللينك مو صحيح.', true); $('fUrl').focus(); return; }
    if (!title && !url && !note) { toast('اكتب عنوان أو لينك على الأقل.', true); $('fTitle').focus(); return; }
    const finalTitle = title || (url ? new URL(url).host.replace(/^www\./, '') : note.slice(0, 40));

    const editing = state.editing;
    state.busy = true;
    const btn = $('saveBtn'); const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'يحفظ…';
    try {
      if (editing) {
        const changes = { type, title: finalTitle, url, note, updatedAt: new Date().toISOString() };
        await mutate((items) => items.map((i) => (i.id === editing.id ? { ...i, ...changes } : i)), 'تعديل: ' + finalTitle);
        toast('انحفظ التعديل');
      } else {
        const item = { id: newId(), type, title: finalTitle, url, note, createdAt: new Date().toISOString() };
        await mutate((items) => [...items, item], 'إضافة: ' + finalTitle);
        state.fresh = item.id;
        lastType = type;
        toast('انحفظ');
      }
      closeSheet();
      render();
    } catch (err) {
      if (err.status === 401) { closeSheet(); return showLock(err.message); }
      toast(err.message || 'ما انحفظ. جرب مرة ثانية.', true);
    } finally {
      state.busy = false; btn.disabled = false; btn.textContent = label;
    }
  });

  $('delBtn').addEventListener('click', async () => {
    const d = $('delBtn'), item = state.editing;
    if (!item || state.busy) return;
    if (!d.classList.contains('armed')) {
      d.classList.add('armed'); d.textContent = 'متأكد؟';
      setTimeout(() => { if (d.textContent === 'متأكد؟') resetDelete(); }, 3000);
      return;
    }
    state.busy = true; d.disabled = true; d.textContent = 'يحذف…';
    try {
      await mutate((items) => items.filter((i) => i.id !== item.id), 'حذف: ' + (item.title || item.id));
      closeSheet(); render(); toast('انحذف');
    } catch (err) {
      if (err.status === 401) { closeSheet(); return showLock(err.message); }
      toast(err.message || 'ما انحذف. جرب مرة ثانية.', true);
      resetDelete();
    } finally {
      state.busy = false;
    }
  });

  /* ---------- search & filters ---------- */
  $('q').addEventListener('input', () => {
    state.query = $('q').value;
    $('qClear').hidden = !state.query;
    renderGrid();
  });
  $('qClear').addEventListener('click', () => { $('q').value = ''; state.query = ''; $('qClear').hidden = true; renderGrid(); $('q').focus(); });
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    state.filter = b.dataset.f;
    for (const c of $('filters').children) c.setAttribute('aria-pressed', String(c === b));
    renderGrid();
  });

  /* ---------- lock / unlock ---------- */
  async function open(cfg, { verify }) {
    state.cfg = cfg;
    if (verify) await checkRepo();
    const d = await readData();
    state.items = d.items; state.sha = d.sha;
    render();
    show('app');
  }

  function showLock(msg = '') {
    const c = loadCfg() || {};
    const guess = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : '';
    $('owner').value = c.owner || guess;
    if (c.repo) $('repo').value = c.repo;
    $('token').value = '';
    $('lockError').textContent = msg;
    show('lock');
  }

  $('lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cfg = { owner: $('owner').value.trim(), repo: $('repo').value.trim(), token: $('token').value.trim() };
    if (!cfg.owner || !cfg.repo || !cfg.token) return;
    const btn = $('unlockBtn');
    btn.disabled = true; btn.textContent = 'يفتح…'; $('lockError').textContent = '';
    try {
      await open(cfg, { verify: true });
      saveCfg(cfg);
    } catch (err) {
      state.cfg = null;
      $('lockError').textContent = err.message || 'صار خطأ. جرب مرة ثانية.';
    } finally {
      btn.disabled = false; btn.textContent = 'افتح';
    }
  });

  $('keyToggle').addEventListener('click', () => {
    const t = $('token'), showing = t.type === 'text';
    t.type = showing ? 'password' : 'text';
    $('keyToggle').textContent = showing ? 'إظهار' : 'إخفاء';
    $('keyToggle').setAttribute('aria-pressed', String(!showing));
  });

  $('lockBtn').addEventListener('click', () => {
    const c = loadCfg();
    if (c) saveCfg({ owner: c.owner, repo: c.repo });   // keep names, forget the key
    state.cfg = null; state.items = []; state.sha = null;
    $('grid').replaceChildren();
    showLock();
  });

  // Coming back to the tab (e.g. after saving from another device) pulls the latest.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !state.cfg || state.busy || sheet.open || $('app').hidden) return;
    try { const d = await readData(); state.items = d.items; state.sha = d.sha; render(); } catch {}
  });

  /* ---------- start ---------- */
  const saved = loadCfg();
  if (PREVIEW) {
    $('lockBtn').hidden = true;
    $('previewNote').hidden = false;
    open({ demo: true }, { verify: false });
  } else if (saved && saved.token) {
    open(saved, { verify: false }).catch((err) => showLock(err.message));
  } else {
    showLock();
  }
})();
</script>
</body>
</html>
